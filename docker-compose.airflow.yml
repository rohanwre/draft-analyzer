# Minimal single-node Airflow (LocalExecutor - no Celery/Redis, this project doesn't
# need distributed workers) for running dags/. Airflow needs its own Postgres metadata
# DB, separate from this project's MySQL data DB - the two are unrelated.
#
# Setup:
#   1. cp .env.example .env and fill in DB_HOST/DB_USER/DB_PASSWORD/DB_NAME
#      (pointing at your real MySQL) plus SNOWFLAKE_* if you want load_snowflake.py
#      to run inside the DAG.
#   2. docker compose -f docker-compose.airflow.yml up airflow-init
#   3. docker compose -f docker-compose.airflow.yml up
#   4. http://localhost:8080 (default login: airflow / airflow)
#   5. Trigger draft_analyzer_crawl manually (multi-day); when it finishes it updates
#      the RAW_LEAGUE_DATA dataset, which starts draft_analyzer_downstream_pipeline
#      automatically. The downstream DAG can also be triggered by hand.
#
# Note: the containers reach MySQL via AIRFLOW_DB_HOST (default host.docker.internal,
# i.e. the host machine under Docker Desktop), not .env's DB_HOST.

services:
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # AIRFLOW_DB_* override DB_* for the containers only: .env's DB_HOST is usually
      # 127.0.0.1 for scripts run on the host, which inside a container is the
      # container itself. host.docker.internal reaches the host's MySQL instead; Docker
      # Desktop forwards it so MySQL sees the connection as localhost (verified: it
      # authenticates as root@localhost), so the same DB_USER works unless you set
      # AIRFLOW_DB_USER/PASSWORD for a MySQL on another machine.
      DB_HOST: ${AIRFLOW_DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${AIRFLOW_DB_USER:-${DB_USER}}
      DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-${DB_PASSWORD}}
      DB_NAME: ${DB_NAME}
      # export_static_data.py (called by draft_analyzer_downstream_pipeline) reads
      # RAILWAY_DB_* specifically, not DB_* - it writes the production JSON snapshot
      # from the production DB, separate from the local raw-data connection above.
      RAILWAY_DB_HOST: ${RAILWAY_DB_HOST}
      RAILWAY_DB_PORT: ${RAILWAY_DB_PORT}
      RAILWAY_DB_USER: ${RAILWAY_DB_USER}
      RAILWAY_DB_PASSWORD: ${RAILWAY_DB_PASSWORD}
      RAILWAY_DB_NAME: ${RAILWAY_DB_NAME}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      # Key-pair auth (needed when MFA is enforced): the host key dir is mounted below.
      SNOWFLAKE_PRIVATE_KEY_PATH: ${SNOWFLAKE_PRIVATE_KEY_PATH:+/opt/snowflake/rsa_key.p8}
      # Slack/Discord incoming webhook for failure/retry/slow-stage alerts (optional).
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-DRAFT_ANALYZER}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-PUBLIC}
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/project
      - ${SNOWFLAKE_KEY_DIR:-~/.snowflake}:/opt/snowflake:ro
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username airflow --password airflow --firstname Rohan --lastname Govindarajan --role Admin --email rohan.wre@gmail.com"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/project
      - ${SNOWFLAKE_KEY_DIR:-~/.snowflake}:/opt/snowflake:ro
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/project
      - ${SNOWFLAKE_KEY_DIR:-~/.snowflake}:/opt/snowflake:ro
    command: scheduler

volumes:
  airflow-postgres-data:
